<!doctype html>
<html lang="en" data-lavish-annotate="off"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decision board</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#e9edf4;background:#10141d}*{box-sizing:border-box}body{margin:0 auto;max-width:1100px;padding:24px}h1{font-size:2rem;line-height:1.15}h2{margin-top:2rem;border-bottom:1px solid #45516a;padding-bottom:.35rem}.lead{color:#b8c5d6}.stats,.queue-controls{background:#182238;padding:12px 16px;border-radius:10px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}.stats{position:sticky;top:0;z-index:2}.queue-controls{margin-top:24px}.card{background:#1b2535;border:1px solid #3d4d64;border-radius:12px;padding:20px;margin:18px 0}.card.new{border-color:#68b6ff}.card.resolved{opacity:.66}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:14px 0}.option{display:block;border:1px solid #53617a;border-radius:8px;padding:12px;cursor:pointer}.option:has(input:checked){border-color:#88c8ff;background:#233955}.option-head{display:flex;align-items:flex-start;gap:8px}.option-head input{flex:none;margin:5px 0 0}.option-head strong{flex:1;min-width:0;overflow-wrap:anywhere}.summary{display:block;color:#c0cbda}.detail{font-size:.9rem;color:#a9b9cb}.rec{font-size:.75rem;color:#122338;background:#9ed5ff;border-radius:4px;padding:2px 6px}.option-head .rec{flex:none;line-height:1.3;white-space:nowrap}textarea{width:100%;min-height:80px;background:#101b29;color:#fff;border:1px solid #60738c;border-radius:8px;padding:10px}button{border:0;border-radius:8px;padding:10px 15px;background:#8dc9ff;color:#102238;font-weight:700;cursor:pointer}button:disabled{opacity:.4}.warning{color:#ffd48c}.status{color:#a9d8b6}.context{white-space:pre-wrap}.brief{color:#b8c5d6;margin:.35rem 0 1rem}.mock-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:14px 0}.mock{min-width:0;margin:0}.mock img{display:block;width:100%;max-width:100%;height:auto;border-radius:8px;cursor:zoom-in}.mock.expanded{grid-column:1/-1}.mock.expanded img{cursor:zoom-out}.mock figcaption{color:#b8c5d6;font-size:.9rem;margin-top:5px}.more-detail{margin:12px 0;color:#a9b9cb}.more-detail p{white-space:pre-wrap;overflow-wrap:anywhere}.card,.option{min-width:0;overflow-wrap:anywhere}.card[hidden],section[hidden]{display:none}.progress{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.progress button{background:#26364d;color:#dce9f7;border:1px solid #60738c;min-width:48px}.progress button[data-state="half"]{background:linear-gradient(90deg,#8dc9ff 50%,#26364d 50%);color:#fff}.progress button[data-state="filled"]{background:#8dc9ff;color:#102238}.progress button[data-state="later"]{background:#4b5770;color:#fff}.progress button[aria-current="step"]{outline:2px solid #fff;outline-offset:2px}.deck-label{font-size:.9rem;color:#b8c5d6;margin:18px 0 0}.deck-nav{display:flex;justify-content:space-between;gap:12px;margin:16px 0}.deck-nav[hidden],.progress[hidden]{display:none}@media(max-width:490px){body{padding:12px}.card{padding:14px}.options{grid-template-columns:minmax(0,1fr)}}
</style></head><body>
<header><h1 id="title"></h1><p class="lead" id="intro"></p><p class="context" id="context"></p></header>
<nav id="progress" class="progress" aria-label="Decision progress" hidden></nav>
<div class="stats"><strong id="tally"></strong><span id="warning" class="warning"></span></div>
<main id="groups"></main>
<nav id="deck-nav" class="deck-nav" aria-label="Card navigation" hidden><button id="previous" type="button">Previous</button><button id="next" type="button">Next</button></nav>
<footer class="queue-controls"><button id="queue-all" type="button">Queue all chosen</button><span>Queue answers, then press Send or Send &amp; End in the Lavish controls.</span></footer>
<script type="application/json" id="board-data">__BOARD_DATA__</script>
<script type="application/json" data-lavish-revisions>__REVISIONS__</script>
<script>
const board=JSON.parse(document.getElementById('board-data').textContent);
const $=(id)=>document.getElementById(id), choices=new Map(), queued=new Map();
const deck=board.layout!=='list', deckCards=[], progressButtons=[];let deckIndex=0, advanceTimer=null;
function showCard(index){if(!deck||index<0||index>=deckCards.length)return;clearTimeout(advanceTimer);deckIndex=index;for(let i=0;i<deckCards.length;i++){const {card,section}=deckCards[i];card.hidden=i!==index;section.hidden=i!==index;progressButtons[i].toggleAttribute('aria-current',i===index);if(i===index)progressButtons[i].setAttribute('aria-current','step')} $('previous').disabled=index===0;$('next').disabled=index===deckCards.length-1}
function progressState(d){const c=choices.get(d.id);if(c==='defer')return 'later';if(!c)return 'empty';return queued.get(d.id)===JSON.stringify([c,$('note-'+d.id)?.value||''])?'filled':'half'}
function updateProgress(){if(!deck)return;deckCards.forEach(({decision:d},i)=>{const button=progressButtons[i],state=progressState(d);button.dataset.state=state;button.textContent=state==='later'?d.id+' -':d.id;button.setAttribute('aria-label',`${d.id}, ${d.title}, ${state==='empty'?'not chosen':state==='half'?'chosen but not queued':state==='filled'?'queued':'later'}`)})}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}
function tally(){let chosen=0,stale=0,defer=0;for(const d of board.decisions){const c=choices.get(d.id);if(c){chosen++;if(c==='defer')defer++;if(queued.get(d.id)!==JSON.stringify([c,$('note-'+d.id)?.value||'']))stale++}}$('tally').textContent=`${chosen}/${board.decisions.length} chosen · ${queued.size} queued · ${defer} later`;$('warning').textContent=stale?`${stale} chosen but not queued`:'';updateProgress()}
function queue(d,advance=true){const selection=choices.get(d.id);if(!selection)return;const note=$('note-'+d.id).value;if(selection==='other'&&!note.trim()){$('status-'+d.id).textContent='Write your answer in the note before queueing Other';return}if(new TextEncoder().encode(note).length>512){$('status-'+d.id).textContent='Note exceeds 512 bytes';return}const label=d.options.find(o=>o.id===selection)?.label||(selection==='other'?'Other: I write my own answer':'Decide later');const prompt=`Answer to ${d.id} ${d.title}: ${label}${note?' - '+note:''}`;const data={schema:'lavish-board-answer.v1',board:board.id,revision:board.revision,decision:d.id,selection,note};if(!window.lavish?.queuePrompt){$('status-'+d.id).textContent='Lavish controls unavailable';return}try{window.lavish.queuePrompt(prompt,{tag:'decision',data,queueKey:d.id,element:$('card-'+d.id)})}catch(error){$('status-'+d.id).textContent='Could not queue answer';return}queued.set(d.id,JSON.stringify([selection,note]));$('status-'+d.id).textContent='Queued';tally();if(deck&&advance&&deckIndex<deckCards.length-1&&deckCards[deckIndex].decision.id===d.id){clearTimeout(advanceTimer);advanceTimer=setTimeout(()=>showCard(deckIndex+1),450)}}
$('title').textContent=board.title;$('intro').textContent=`${board.decisions.length} decisions in ${board.groups.length} groups`;$('context').textContent=board.context||'';
for(const group of board.groups){const groupSection=el('section');groupSection.append(el('h2','',group.title));if(!deck)$('groups').append(groupSection);for(const d of board.decisions.filter(x=>x.group===group.id)){const section=deck?el('section'):groupSection;if(deck){section.append(el('p','deck-label',`${group.title} - ${deckCards.length+1} of ${board.decisions.length}`));$('groups').append(section)}const card=el('article','card'+(d.new?' new':'')+(d.resolved?' resolved':''));card.id='card-'+d.id;card.dataset.lavishQuestion=d.id;card.dataset.lavishRevision='r'+board.revision;card.append(el('h3','',`${d.id} · ${d.title}`),el('p','',d.question));if(d.new)card.append(el('span','rec','New'));card.append(el('p','brief',d.brief));if(d.mocks?.length){const grid=el('div','mock-grid');for(const mock of d.mocks){const figure=el('figure','mock');const img=el('img');img.src=mock.src;img.alt=mock.alt;img.addEventListener('click',()=>figure.classList.toggle('expanded'));figure.append(img,el('figcaption','',mock.caption));grid.append(figure)}card.append(grid)}const options=el('div','options');for(const opt of [...d.options,{id:'other',label:'Other: I write my own answer',summary:'Write your answer in the note below'},{id:'defer',label:'Decide later / need more input',summary:'Keep this decision open'}]){const label=el('label','option');const head=el('span','option-head');const input=el('input');input.type='radio';input.name='choice-'+d.id;input.value=opt.id;input.disabled=!!d.resolved;input.addEventListener('change',()=>{choices.set(d.id,opt.id);$('status-'+d.id).textContent='Chosen';tally()});head.append(input,el('strong','',opt.label));if(opt.id===d.recommended)head.append(el('span','rec','rec'));label.append(head,el('span','summary',opt.summary||''));if(opt.detail)label.append(el('span','detail',opt.detail));options.append(label)}card.append(options,el('p','detail','No option fits? Choose Other and write your answer in the note.'));if(d.recommendation_reason)card.append(el('p','detail',`Recommendation: ${d.recommendation_reason}`));if(d.consequence)card.append(el('p','detail',`If chosen: ${d.consequence}`));if(d.detail){const extra=el('details','more-detail');extra.append(el('summary','','More detail'));for(const paragraph of d.detail.split(/\n\s*\n/))extra.append(el('p','',paragraph));card.append(extra)}const note=el('textarea');note.id='note-'+d.id;note.placeholder='Optional note (512 bytes maximum)';note.disabled=!!d.resolved;note.addEventListener('input',tally);card.append(note);const button=el('button','', 'Queue answer');button.type='button';button.disabled=!!d.resolved;button.addEventListener('click',()=>queue(d));card.append(button,el('p','status',d.resolved?`Answered: ${d.resolved}`:'Not chosen'));card.lastChild.id='status-'+d.id;section.append(card);if(deck)deckCards.push({card,section,decision:d})}}
if(deck){$('progress').hidden=false;$('deck-nav').hidden=false;for(const [index] of deckCards.entries()){const button=el('button');button.type='button';button.addEventListener('click',()=>showCard(index));$('progress').append(button);progressButtons.push(button)}$('previous').addEventListener('click',()=>showCard(deckIndex-1));$('next').addEventListener('click',()=>showCard(deckIndex+1));document.addEventListener('keydown',event=>{if(event.target.closest('textarea')||event.altKey||event.ctrlKey||event.metaKey)return;if(event.key==='ArrowLeft')showCard(deckIndex-1);if(event.key==='ArrowRight')showCard(deckIndex+1)});showCard(0)}$('queue-all').addEventListener('click',()=>{for(const d of board.decisions)if(choices.has(d.id)&&queued.get(d.id)!==JSON.stringify([choices.get(d.id),$('note-'+d.id).value]))queue(d,false)});tally();
</script></body></html>
